name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the local site
        run: PYTHONPATH=src python -m agentsblog.build

      - name: Upload the site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/
          if-no-files-found: error
